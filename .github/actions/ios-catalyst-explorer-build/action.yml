name: build ios explorer for mac catalyst

description: build the iOS Lynx Explorer app for Mac Catalyst

inputs:
  build-arch:
    description: The Mac Catalyst architecture to build (arm64 or x86_64).
    required: true
  build-params:
    description: Parameters passed to the Explorer dependency setup script.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install Common Dependencies
      uses: ./lynx/.github/actions/common-deps
    - name: Install iOS Dependencies
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 20
        max_attempts: 3
        command: |-
          set -e
          cd "$GITHUB_WORKSPACE/lynx"
          source tools/envsetup.sh
          pushd explorer/darwin/ios/lynx_explorer
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          bash bundle_install.sh ${{ inputs.build-params }}
          popd
    - name: Build Mac Catalyst Explorer App
      shell: bash
      run: |-
        cd "$GITHUB_WORKSPACE/lynx"
        source tools/envsetup.sh
        pushd explorer/darwin/ios/lynx_explorer
        bash build_macos_catalyst.sh ${{ inputs.build-arch }}
        popd
        tar --strip-components 10 -czvf LynxExplorer-catalyst-${{ inputs.build-arch }}.app.tar.gz explorer/darwin/ios/lynx_explorer/iOSCoreBuild/DerivedData-Catalyst-${{ inputs.build-arch }}/Build/Products/Debug-maccatalyst/LynxExplorer.app
