name: publish ios sdk

description: package ios source code, upload the zip source, and publish the podspec file to the private specs repo

inputs:
  version:
    required: false
    description: The version of pod.
    type: string
  tag:
    required: false
    type: string
    description: The tag for release.
  component:
    required: false
    type: string
    default: 'all'
  specs_repo_app_token:
    description: The GitHub App installation token scoped to the private specs repo
    type: string
  github_token:
    description: The github token
    type: string
  specs_repo_url:
    required: false
    description: The private specs repo URL.
    type: string
    default: 'https://github.com/lynx-family/Specs.git'
  specs_repo_name:
    required: false
    description: The local CocoaPods repo name for the private specs repo.
    type: string
    default: 'lynx-specs'
  storage_type:
    required: false
    description: The zip storage backend. Supported values are github_release and s3.
    type: string
    default: 'github_release'

runs:
  using: composite
  steps:
    - name: Prepare cocoapods publish source
      shell: bash
      run: |-
        cd $GITHUB_WORKSPACE/lynx
        source tools/envsetup.sh
        python3 tools/ios_tools/cocoapods_publish_helper.py \
          --prepare-source \
          --tag "${{ inputs.tag }}" \
          --version "${{ inputs.version }}" \
          --component "${{ inputs.component }}" \
          --storage-type "${{ inputs.storage_type }}"
    - name: Push iOS SDK to release
      if: ${{ inputs.storage_type == 'github_release' }}
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ inputs.tag }}
        token: ${{ inputs.github_token }}
        artifacts: '${{ github.workspace }}/lynx/*.zip'
        replacesArtifacts: true
        allowUpdates: true
        body: ''
    - name: Publish to private CocoaPods Specs Repo
      env:
        SPECS_REPO_GITHUB_APP_TOKEN: ${{ inputs.specs_repo_app_token }}
      shell: bash
      run: |-
        cd $GITHUB_WORKSPACE/lynx
        source tools/envsetup.sh
        git config --global user.name "lynx.authors"
        git config --global user.email "lynx.authors@users.noreply.github.com"
        python3 tools/ios_tools/cocoapods_publish_helper.py \
          --publish \
          --component "${{ inputs.component }}" \
          --repo-name "${{ inputs.specs_repo_name }}" \
          --repo-url "${{ inputs.specs_repo_url }}"
