name: node_lynx_publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The npm tag to publish with.'
        required: false
        default: 'latest'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  node-lynx-linux-build:
    runs-on: lynx-ubuntu-22.04-large
    timeout-minutes: 60
    steps:
      - name: Download Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: lynx
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: 'lynx/.node-version'

      - name: Install Common Dependencies
        uses: ./lynx/.github/actions/common-deps
        with:
          target: clay
      - name: Install Tasm Node Dependencies
        run: |-
          cd $GITHUB_WORKSPACE/lynx
          source tools/envsetup.sh
          pushd oliver/lynx-tasm
          npm install
          popd
      - name: Build Linux Node Lynx
        run: |-
          cd $GITHUB_WORKSPACE/lynx
          tools/env.sh python3 oliver/build_gn.py --platform linux --type node-lynx --clean true --show_log true
          cp oliver/node-lynx/build/linux/Release/node_lynx.node oliver/node-lynx/platform/linux-x64/node_lynx.node
      - name: Test Linux Node Lynx
        run: |-
          cd $GITHUB_WORKSPACE/lynx
          tools/env.sh pnpm --filter @lynx-js/node-lynx run test
      - name: Upload Linux Node Lynx Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: node-lynx-linux-x64
          path: lynx/oliver/node-lynx/platform/linux-x64/node_lynx.node
          if-no-files-found: error

  node-lynx-darwin-build:
    runs-on: lynx-darwin-15.6.1-medium
    timeout-minutes: 60
    steps:
      - name: Download Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: lynx
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: 'lynx/.node-version'

      - name: Install Common Dependencies
        uses: ./lynx/.github/actions/common-deps
        with:
          target: clay
      - name: Install Tasm Node Dependencies
        run: |-
          cd $GITHUB_WORKSPACE/lynx
          source tools/envsetup.sh
          pushd oliver/lynx-tasm
          npm install
          popd
      - name: Build Darwin Node Lynx
        run: |-
          cd $GITHUB_WORKSPACE/lynx
          if [ "$(uname -m)" != "arm64" ]; then
            echo "node-lynx publish currently expects an arm64 Darwin runner." >&2
            exit 1
          fi
          tools/env.sh python3 oliver/build_gn.py --platform darwin --type node-lynx --local true --clean true --show_log true
          cp oliver/node-lynx/build/darwin/Release/node_lynx.node oliver/node-lynx/platform/darwin-arm64/node_lynx.node
      - name: Test Darwin Node Lynx
        run: |-
          cd $GITHUB_WORKSPACE/lynx
          tools/env.sh pnpm --filter @lynx-js/node-lynx run test
      - name: Upload Darwin Node Lynx Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: node-lynx-darwin-arm64
          path: lynx/oliver/node-lynx/platform/darwin-arm64/node_lynx.node
          if-no-files-found: error

  node-lynx-publish:
    needs:
      - node-lynx-linux-build
      - node-lynx-darwin-build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: lynx
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: 'lynx/.node-version'

          registry-url: 'https://registry.npmjs.org'
      - name: Install Common Dependencies
        uses: ./lynx/.github/actions/common-deps
        with:
          target: tasm
      - name: Download Linux Node Lynx Artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: node-lynx-linux-x64
          path: lynx/oliver/node-lynx/platform/linux-x64
      - name: Download Darwin Node Lynx Artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: node-lynx-darwin-arm64
          path: lynx/oliver/node-lynx/platform/darwin-arm64
      - name: Build Node Lynx Package
        run: |-
          cd $GITHUB_WORKSPACE/lynx
          source tools/envsetup.sh
          pnpm --filter @lynx-js/node-lynx run build:resources
          pnpm --filter @lynx-js/node-lynx exec tsc
      - name: Publish Node Lynx
        run: |-
          cd $GITHUB_WORKSPACE/lynx/oliver/node-lynx
          node scripts/publish.js --skip-build --tag "${{ github.event.inputs.tag }}"
