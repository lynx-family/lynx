name: publish-release
run-name: Recover Linux SDK 4.3.0-rc.1

on:
  push:
    branches:
      - recovery/linux-sdk-4.3.0-rc.1
    paths:
      - .github/workflows/publish-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-sdk-recovery-4.3.0-rc.1
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RELEASE_TAG: '4.3.0-rc.1'
  SOURCE_SHA: 'fd2141a210b48dd8ea1df043e658d37b19c70a6a'

jobs:
  linux-sdk-release:
    if: github.repository == 'lynx-family/lynx'
    timeout-minutes: 60
    runs-on: lynx-ubuntu-22.04-large
    permissions:
      contents: write
    steps:
      - name: Download Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: lynx
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify immutable release source
        working-directory: lynx
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$SOURCE_SHA"
          {
            echo "Release: $RELEASE_TAG"
            echo "Source: $SOURCE_SHA"
            echo "Habitat override: 0.3.151"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify existing release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await github.rest.repos.getReleaseByTag({
              ...context.repo,
              tag: process.env.RELEASE_TAG,
            });

      - name: Python Setup
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install Common Dependencies
        uses: ./lynx/.github/actions/common-deps
        env:
          HABITAT_VERSION: '0.3.151'
          HABITAT_COMPATIBLE_CHECK: 'false'
        with:
          cache-backend: github
          target: clay

      - name: Build Linux SDK
        working-directory: lynx
        shell: bash
        run: |
          set -eo pipefail
          source tools/envsetup.sh
          python3 platform/linux/build_release.py --target-cpu x64

      - name: Verify Linux SDK checksum
        working-directory: lynx/out/Default
        shell: bash
        run: sha256sum --check lynx_sdk_linux_x64.zip.sha256

      - name: Upload Linux SDK to existing release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const {data: release} = await github.rest.repos.getReleaseByTag({
              ...context.repo,
              tag: process.env.RELEASE_TAG,
            });
            const params = {...context.repo, release_id: release.id};
            const assets = await github.paginate(
              github.rest.repos.listReleaseAssets, {...params, per_page: 100}
            );
            for (const name of ['lynx_sdk_linux_x64.zip', 'lynx_sdk_linux_x64.zip.sha256']) {
              const data = fs.readFileSync(path.join(
                process.env.GITHUB_WORKSPACE, 'lynx/out/Default', name
              ));
              const digest = `sha256:${crypto.createHash('sha256').update(data).digest('hex')}`;
              const existing = assets.find(asset => asset.name === name);
              if (existing) {
                if (existing.digest !== digest) {
                  throw new Error(`Existing asset ${name} has a different or unavailable digest; refusing to replace it`);
                }
                core.info(`${name} already exists with the expected digest`);
                continue;
              }
              await github.rest.repos.uploadReleaseAsset({
                ...params,
                name,
                data,
                headers: {
                  'content-type': name.endsWith('.zip') ? 'application/zip' : 'text/plain',
                  'content-length': data.length,
                },
              });
              core.info(`Uploaded ${name} (${digest})`);
            }
