name: publish-release
on:
  push:
    tags:
      - '*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag'
        required: true
        type: string
      correlationId:
        description: 'optional external correlation ID'
        required: false
        type: string

  schedule:
    - cron: '0 22 * * *'

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.event_name == 'schedule' && 'nightly' || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NIGHTLY_BASE_VERSION: '4.4.0'

jobs:
  get-version:
    runs-on: lynx-ubuntu-22.04-medium
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
      INPUT_TAG: ${{ inputs.tag || '' }}
      CORRELATION_ID: ${{ inputs.correlationId || '' }}
      GITHUB_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.resolve.outputs.VERSION }}
      ios_storage_type: ${{ steps.resolve.outputs.IOS_STORAGE_TYPE }}
      checkout_ref: ${{ steps.resolve.outputs.CHECKOUT_REF }}
      release_mode: ${{ steps.resolve.outputs.RELEASE_MODE }}
      release_id: ${{ steps.prepare_release.outputs.RELEASE_ID }}
    steps:
      - name: Resolve and validate release plan
        id: resolve
        shell: bash
        run: |-
          set -euo pipefail

          if [ "$EVENT_NAME" = "schedule" ]; then
            release_mode="nightly"
            source_ref="$GITHUB_SHA"
            source_sha="$(curl --silent --show-error --fail \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$source_ref" |
              jq --raw-output '.sha')"
            commit_short="${source_sha:0:8}"
            version="${NIGHTLY_BASE_VERSION}-nightly.$(TZ=Asia/Shanghai date +'%Y%m%d%H%M').${GITHUB_RUN_NUMBER}.g${commit_short}"
            checkout_ref="$source_sha"
            storage_type="s3"
            tag=""
          else
            release_mode="official"
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              tag="$INPUT_TAG"
              source_ref="$GITHUB_SHA"
            elif [ "$EVENT_NAME" = "push" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
              tag="$REF_NAME"
              source_ref="$GITHUB_SHA"
            else
              echo "Unsupported release event: $EVENT_NAME"
              exit 1
            fi

            version="$tag"
            source_sha="$(curl --silent --show-error --fail \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$source_ref" |
              jq --raw-output '.sha')"
            checkout_ref="$source_sha"
            storage_type="github_release"
          fi

          official_version_regex='^[0-9]+\.[0-9]+\.[0-9]+(-((rc|alpha)\.[0-9]+))?$'
          nightly_version_regex='^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{12}\.[0-9]+\.g[0-9a-f]+$'
          if [ "$release_mode" = "official" ] && ! [[ "$version" =~ $official_version_regex ]]; then
            echo "Official version is invalid: $version"
            exit 1
          fi
          if [ "$release_mode" = "nightly" ] && ! [[ "$version" =~ $nightly_version_regex ]]; then
            echo "Nightly version is invalid: $version"
            exit 1
          fi

          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
          echo "IOS_STORAGE_TYPE=$storage_type" >> "$GITHUB_OUTPUT"
          echo "CHECKOUT_REF=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "RELEASE_MODE=$release_mode" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_OUTPUT"
          echo "TAG=$tag" >> "$GITHUB_OUTPUT"

          {
            echo "### Release plan"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            printf '| Release mode | `%s` |\n' "$release_mode"
            printf '| Version | `%s` |\n' "$version"
            printf '| Source SHA | `%s` |\n' "$source_sha"
            printf '| iOS storage type | `%s` |\n' "$storage_type"
            if [ -n "$CORRELATION_ID" ]; then
              printf '| Correlation ID | `%s` |\n' "$CORRELATION_ID"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or validate release tag
        if: ${{ steps.resolve.outputs.RELEASE_MODE == 'official' }}
        shell: bash
        env:
          TAG: ${{ steps.resolve.outputs.TAG }}
          SOURCE_SHA: ${{ steps.resolve.outputs.SOURCE_SHA }}
        run: |-
          set -euo pipefail

          if tag_sha="$(curl --silent --fail \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>/dev/null |
            jq --raw-output '.object.sha' 2>/dev/null)"; then
            object_type="$(curl --silent --show-error --fail \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" |
              jq --raw-output '.object.type')"
            if [ "$object_type" = "tag" ]; then
              tag_sha="$(curl --silent --show-error --fail \
                --header "Authorization: Bearer $GITHUB_TOKEN" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" |
                jq --raw-output '.object.sha')"
            fi
            if [ "$tag_sha" != "$SOURCE_SHA" ]; then
              echo "Tag $TAG already points to $tag_sha, expected $SOURCE_SHA."
              exit 1
            fi
            echo "Reusing tag $TAG at $SOURCE_SHA."
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            curl --silent --show-error --fail \
              --request POST \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$(jq -n \
                --arg ref "refs/tags/$TAG" \
                --arg sha "$SOURCE_SHA" \
                '{ref: $ref, sha: $sha}')" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs" >/dev/null
            echo "Created tag $TAG at $SOURCE_SHA."
          else
            echo "Tag $TAG is missing for a tag push event."
            exit 1
          fi

      - name: Create or reuse draft release
        id: prepare_release
        if: ${{ steps.resolve.outputs.RELEASE_MODE == 'official' }}
        shell: bash
        env:
          TAG: ${{ steps.resolve.outputs.TAG }}
          SOURCE_SHA: ${{ steps.resolve.outputs.SOURCE_SHA }}
        run: |-
          set -euo pipefail

          release_file="$(mktemp)"
          create_file="$(mktemp)"
          trap 'rm -f "$release_file" "$create_file"' EXIT
          release_status="$(curl --silent --show-error \
            --output "$release_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" || true)"
          if [ "$release_status" = "200" ]; then
            release_info="$(cat "$release_file")"
          elif [ "$release_status" = "404" ]; then
            release_info=""
          else
            echo "Failed to query release for $TAG (HTTP $release_status):"
            cat "$release_file"
            exit 1
          fi
          if [ -n "$release_info" ]; then
            release_id="$(echo "$release_info" | jq --raw-output '.id')"
            is_draft="$(echo "$release_info" | jq --raw-output '.draft')"
            target_commitish="$(echo "$release_info" | jq --raw-output '.target_commitish')"
            if [ "$is_draft" != "true" ]; then
              echo "Release for $TAG is already published."
              exit 1
            fi
            target_sha="$(curl --silent --show-error --fail \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$target_commitish" |
              jq --raw-output '.sha')"
            if [ "$target_sha" != "$SOURCE_SHA" ]; then
              echo "Draft release for $TAG targets $target_sha, expected $SOURCE_SHA."
              exit 1
            fi
            echo "Reusing draft release $release_id for $TAG."
          else
            prerelease=false
            if [[ "$TAG" =~ -(rc|alpha)\. ]]; then
              prerelease=true
            fi
            echo "Creating draft release: tag=$TAG source_sha=$SOURCE_SHA prerelease=$prerelease"
            create_status="$(curl --silent --show-error \
              --output "$create_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$(jq -n \
                --arg tag_name "$TAG" \
                --arg target_commitish "$SOURCE_SHA" \
                --arg name "$TAG" \
                --argjson prerelease "$prerelease" \
                '{tag_name: $tag_name, target_commitish: $target_commitish, name: $name,
                  body: "", draft: true, prerelease: $prerelease}')" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases" || true)"
            if [ "$create_status" != "201" ]; then
              echo "Failed to create draft release (HTTP $create_status)."
              jq --compact-output \
                '{message, errors, documentation_url}' "$create_file" 2>/dev/null ||
                cat "$create_file"
              exit 1
            fi
            release_id="$(jq --exit-status --raw-output '.id' "$create_file")"
            echo "Created draft release $release_id for $TAG."
          fi

          echo "RELEASE_ID=$release_id" >> "$GITHUB_OUTPUT"

  android-explorer-build:
    timeout-minutes: 60
    runs-on: lynx-ubuntu-22.04-large
    needs: get-version
    if: ${{ needs.get-version.outputs.release_mode == 'official' }}
    permissions:
      contents: write
    steps:
      - name: Download Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: lynx
          ref: ${{ needs.get-version.outputs.checkout_ref }}
          fetch-depth: 0
      - name: Build Explorer App
        uses: ./lynx/.github/actions/android-explorer-build
        with:
          abi-list: armeabi-v7a,x86,x86_64,arm64-v8a
      - name: push to release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: ${{ needs.get-version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: '${{ github.workspace }}/lynx/explorer/android/lynx_explorer/build/outputs/apk/noasan/release/LynxExplorer-noasan-release.apk'
          allowUpdates: true
          updateOnlyUnreleased: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          draft: true

  ios-explorer-build:
    timeout-minutes: 60
    runs-on: lynx-darwin-15.6.1-medium
    needs: get-version
    if: ${{ needs.get-version.outputs.release_mode == 'official' }}
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - name: Download Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: lynx
          ref: ${{ needs.get-version.outputs.checkout_ref }}
          fetch-depth: 0
      - name: Build Explorer App
        uses: ./lynx/.github/actions/ios-explorer-build
        with:
          build-arch: ${{ matrix.arch }}
      - name: push explorer to release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: ${{ needs.get-version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: '${{ github.workspace }}/lynx/LynxExplorer-${{ matrix.arch }}.app.tar.gz'
          allowUpdates: true
          updateOnlyUnreleased: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          draft: true

  harmony-explorer-build:
    runs-on: lynx-custom-container
    container:
      image: ghcr.io/lynx-family/ubuntu24.04-harmony@sha256:da3d7313011f5f0e63a118197d15c005617cf3147282e77b1cd30402dcd142ac
      credentials:
        username: lynx-family
        password: ${{ secrets.GITHUB_TOKEN }}
    needs: get-version
    if: ${{ needs.get-version.outputs.release_mode == 'official' }}
    permissions:
      contents: write
      packages: read
    defaults:
      run:
        working-directory: ${{ github.workspace }}
        shell: bash
    steps:
      - name: Download Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: lynx
          ref: ${{ needs.get-version.outputs.checkout_ref }}
          fetch-depth: 0
      - name: Build Explorer App
        uses: ./lynx/.github/actions/harmony-explorer-build
      - name: push explorer to release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: ${{ needs.get-version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: '${{ github.workspace }}/lynx/explorer/harmony/lynx_explorer/build/default/outputs/default/lynx_explorer-default-unsigned.hap'
          allowUpdates: true
          updateOnlyUnreleased: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          draft: true

  android-sdk-release:
    runs-on: ubuntu-22.04
    needs: get-version
    if: ${{ needs.get-version.outputs.release_mode == 'official' }}
    timeout-minutes: 300
    steps:
      - name: Download Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: lynx
          ref: ${{ needs.get-version.outputs.checkout_ref }}
          fetch-depth: 0
      - name: Free up disk space
        uses: ./lynx/.github/actions/free-android-disk
      - name: Python Setup
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Setup Android environment
        uses: ./lynx/.github/actions/setup-android-env
      - name: Install Common Dependencies
        uses: ./lynx/.github/actions/common-deps
        with:
          cache-backend: 'github'
      - name: Android SDK Release
        uses: ./lynx/.github/actions/android-sdk-release
        with:
          version: ${{ needs.get-version.outputs.version }}
          signingKeyId: ${{ secrets.SIGNING_KEY_ID }}
          signingPassword: ${{ secrets.SIGNING_PASSWORD }}
          signingSecretKey: ${{ secrets.SIGNING_SECRET_KEY }}
          abiList: 'armeabi-v7a,x86,x86_64,arm64-v8a'
      - name: Package maven artifacts
        run: |-
          cd $GITHUB_WORKSPACE/lynx
          pushd platform/android
          ./gradlew zipArtifacts -Pversion=${{ needs.get-version.outputs.version }}
          ./gradlew zipDevArtifacts -Pversion=${{ needs.get-version.outputs.version }}-dev
          ./gradlew getArtifactList -Pversion=${{ needs.get-version.outputs.version }}
          popd
          pushd platform/android/build
          artifact_list=$(<artifact-list)
          echo "::set-output name=artifact_list::$artifact_list"
          popd
        id: build_artifact
      - name: Publish artifact to maven
        uses: lynx-infra/maven-publish-action@53b4da2f23f9cfc4e905b135eda2724fcf5a0f0e # main
        with:
          portal_api_token: ${{ secrets.PORTAL_API_TOKEN }}
          artifact_path_list: ${{ steps.build_artifact.outputs.artifact_list }}

  android-sdk-snapshot-release:
    runs-on: lynx-ubuntu-22.04-large
    needs: get-version
    if: ${{ needs.get-version.outputs.release_mode == 'nightly' }}
    timeout-minutes: 240
    steps:
      - name: Download Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: lynx
          ref: ${{ needs.get-version.outputs.checkout_ref }}
          fetch-depth: 0
      - name: Python Setup
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install Common Dependencies
        uses: ./lynx/.github/actions/common-deps
        with:
          cache-backend: 'github'
      - name: Resolve Android publish version
        id: resolve_android_publish_version
        run: |-
          version="${{ needs.get-version.outputs.version }}"
          version="${version}-SNAPSHOT"
          echo "ANDROID_PUBLISH_VERSION=$version" >> "$GITHUB_OUTPUT"
      - name: Android SDK Snapshot Release
        uses: ./lynx/.github/actions/android-sdk-snapshot-release
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
        with:
          version: ${{ steps.resolve_android_publish_version.outputs.ANDROID_PUBLISH_VERSION }}
          abiList: 'armeabi-v7a,x86,x86_64,arm64-v8a'

  ios-sdk-publish:
    timeout-minutes: 60
    runs-on: macos-14
    needs: get-version
    permissions:
      contents: write
    env:
      REPO_LYNX_ARTIFACTS_S3_AK: ${{ secrets.REPO_LYNX_ARTIFACTS_S3_AK }}
      REPO_LYNX_ARTIFACTS_S3_SK: ${{ secrets.REPO_LYNX_ARTIFACTS_S3_SK }}
      REPO_LYNX_ARTIFACTS_S3_BUCKET: ${{ vars.REPO_LYNX_ARTIFACTS_S3_BUCKET }}
      REPO_LYNX_ARTIFACTS_S3_REGION: ${{ vars.REPO_LYNX_ARTIFACTS_S3_REGION }}
      REPO_LYNX_ARTIFACTS_S3_UPLOAD_DOMAIN: ${{ vars.REPO_LYNX_ARTIFACTS_S3_UPLOAD_DOMAIN }}
      REPO_LYNX_ARTIFACTS_S3_PUBLIC_DOMAIN: ${{ vars.REPO_LYNX_ARTIFACTS_S3_PUBLIC_DOMAIN }}
      REPO_LYNX_ARTIFACTS_S3_PATH_PREFIX: ${{ vars.REPO_LYNX_ARTIFACTS_S3_PATH_PREFIX || 'ios-sdk' }}
    steps:
      - name: Download Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.get-version.outputs.checkout_ref }}
          fetch-depth: 0
          path: lynx
      - name: Python Setup
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0.5'
      - name: Install Common Dependencies
        uses: ./lynx/.github/actions/common-deps
        with:
          cache-backend: github
      - name: Create Specs repo GitHub App token
        id: specs_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.SPECS_REPO_APP_ID }}
          private-key: ${{ secrets.SPECS_REPO_APP_PRIVATE_KEY }}
          owner: lynx-family
          repositories: Specs
          permission-contents: write
      - name: Publish iOS SDK
        uses: ./lynx/.github/actions/ios-sdk-publish
        with:
          version: ${{ needs.get-version.outputs.version }}
          tag: ${{ needs.get-version.outputs.version }}
          storage_type: ${{ needs.get-version.outputs.ios_storage_type }}
          specs_repo_app_token: ${{ steps.specs_app_token.outputs.token }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          specs_repo_url: https://github.com/lynx-family/Specs.git
          specs_repo_name: lynx-specs
          component: all
      - name: Publish iOS dev SDK
        uses: ./lynx/.github/actions/ios-sdk-publish
        env:
          LYNX_ENABLE_RECORDER: 1
        with:
          version: ${{ needs.get-version.outputs.version }}-dev
          tag: ${{ needs.get-version.outputs.version }}
          storage_type: ${{ needs.get-version.outputs.ios_storage_type }}
          specs_repo_app_token: ${{ steps.specs_app_token.outputs.token }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          specs_repo_url: https://github.com/lynx-family/Specs.git
          specs_repo_name: lynx-specs
          component: all

  cocoapods-lynx-library-publish:
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    needs: get-version
    environment: rubygems
    permissions:
      contents: read
    steps:
      - name: Download Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.get-version.outputs.checkout_ref }}
          fetch-depth: 0
          path: lynx
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.1'
      - name: Resolve gem version
        id: gem_version
        env:
          RELEASE_VERSION: ${{ needs.get-version.outputs.version }}
        run: |-
          gem_version=$(ruby -e "puts Gem::Version.new(ENV.fetch('RELEASE_VERSION')).to_s")
          echo "Gem version: $gem_version"
          echo "version=$gem_version" >> "$GITHUB_OUTPUT"
      - name: Check published version
        id: published_version
        run: |-
          versions=$(gem list --remote --exact --all cocoapods-lynx-library || true)
          echo "Published versions: ${versions:-none}"
          if echo "$versions" | tr '(), ' '\n' | grep -Fx "${{ steps.gem_version.outputs.version }}" > /dev/null; then
            echo "publish_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish_needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test
        run: |-
          cd $GITHUB_WORKSPACE/lynx/tools/ios_tools/cocoapods-lynx-library
          ruby -Itest test/autolink_test.rb
      - name: Build
        id: build_gem
        env:
          GEM_VERSION: ${{ steps.gem_version.outputs.version }}
        run: |-
          cd $GITHUB_WORKSPACE/lynx/tools/ios_tools/cocoapods-lynx-library
          ruby <<'RUBY'
          path = 'cocoapods-lynx-library.gemspec'
          version = ENV.fetch('GEM_VERSION')
          content = File.read(path)
          updated = content.sub(/spec\.version\s*=\s*['"][^'"]+['"]/, "spec.version = '#{version}'")
          abort "Unable to update #{path} version" if updated == content
          File.write(path, updated)
          RUBY
          gem build cocoapods-lynx-library.gemspec | tee gem-build.log
          gem_file=$(awk -F': ' '/File:/ {print $2}' gem-build.log | tail -n 1)
          echo "gem_file=$gem_file" >> "$GITHUB_OUTPUT"
          ruby -rrubygems/package -e 'spec = Gem::Package.new(ARGV.fetch(0)).spec; puts "#{spec.name} #{spec.version}"; puts spec.summary' "$gem_file"
      - name: Upload gem artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cocoapods-lynx-library-${{ steps.gem_version.outputs.version }}
          path: lynx/tools/ios_tools/cocoapods-lynx-library/${{ steps.build_gem.outputs.gem_file }}
      - name: Publish CocoaPods plugin
        if: steps.published_version.outputs.publish_needed == 'true'
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |-
          cd $GITHUB_WORKSPACE/lynx/tools/ios_tools/cocoapods-lynx-library
          if [ -z "$GEM_HOST_API_KEY" ]; then
            echo "RUBYGEMS_API_KEY is required to publish cocoapods-lynx-library."
            exit 1
          fi
          gem push "${{ steps.build_gem.outputs.gem_file }}"

  harmony-sdk-publish:
    name: Publish Harmony SDK (${{ matrix.label }})
    runs-on: lynx-custom-container
    container:
      image: ghcr.io/lynx-family/ubuntu24.04-harmony@sha256:da3d7313011f5f0e63a118197d15c005617cf3147282e77b1cd30402dcd142ac
      credentials:
        username: lynx-family
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    needs: get-version
    strategy:
      matrix:
        include:
          - version_suffix: ''
            modules: 'default'
            build_param: ''
            label: 'formal'
          - version_suffix: '-dev'
            modules: 'lynx lynx_devtool lynx_base'
            build_param: '--dev'
            label: 'dev'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Install git-cliff
        run: |
          cargo install git-cliff --locked
          git-cliff --version
      - name: Download Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: lynx
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.get-version.outputs.checkout_ref }}
      - name: Get latest tag
        id: get-latest-tag
        uses: ./lynx/.github/actions/get-latest-tag
        with:
          current-tag: ${{ needs.get-version.outputs.version }}
      - name: Install Common Dependencies
        uses: ./lynx/.github/actions/common-deps
        with:
          cache-key-prefix: '-container'
      - name: Generate Change Log
        run: |
          cd $GITHUB_WORKSPACE/lynx
          source tools/envsetup.sh
          COMMIT_ID=$(git rev-list -n 1 ${{ steps.get-latest-tag.outputs.latest-tag }})
          python3 explorer/harmony/script/generate_changelog.py --version ${{ needs.get-version.outputs.version }}${{ matrix.version_suffix }} --modules ${{ matrix.modules }} --base_commit $COMMIT_ID
      - name: Build Harmony SDK
        run: |
          cd $GITHUB_WORKSPACE/lynx
          source tools/envsetup.sh
          pushd platform/harmony && ohpm install && popd
          pushd explorer/harmony && ohpm install && popd
          python3 explorer/harmony/script/build.py ${{ matrix.build_param }} --build_lynx_core --build_har --modules ${{ matrix.modules }} --override_version ${{ needs.get-version.outputs.version }}${{ matrix.version_suffix }}
      - name: Publish Harmony SDK
        run: |
          cd $GITHUB_WORKSPACE/lynx
          source tools/envsetup.sh
          export PUBLISH_KEY_PASSPHRASE=${{ secrets.HARMONY_PUBLISH_KEY_PASSPHRASE }}
          cat << EOF > publish_key
          ${{ secrets.HARMONY_PUBLISH_KEY }}
          EOF
          ohpm config set publish_registry https://ohpm.openharmony.cn/ohpm
          export PUBLISH_ID=${{ secrets.HARMONY_PUBLISH_ID }}
          export KEY_PATH=$GITHUB_WORKSPACE/lynx/publish_key
          python3 explorer/harmony/script/publish.py --modules ${{ matrix.modules }} --version ${{ needs.get-version.outputs.version }}${{ matrix.version_suffix }}

  macos-explorer-release:
    timeout-minutes: 60
    runs-on: lynx-darwin-15.6.1-medium
    needs: get-version
    if: ${{ needs.get-version.outputs.release_mode == 'official' }}
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Download Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: lynx
          ref: ${{ needs.get-version.outputs.checkout_ref }}
          fetch-depth: 0
      - name: Build macOS Explorer
        uses: ./lynx/.github/actions/macos-explorer-build
        with:
          build-arch: ${{ matrix.arch }}
      - name: push explorer to release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: ${{ needs.get-version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: '${{ github.workspace }}/lynx/LynxExplorer-macos-${{ matrix.arch }}.app.tar.gz,${{ github.workspace }}/lynx/out/Default/lynx_sdk_macos_${{ matrix.arch }}.zip'
          allowUpdates: true
          updateOnlyUnreleased: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          draft: true

  linux-sdk-release:
    timeout-minutes: 60
    needs: get-version
    if: ${{ needs.get-version.outputs.release_mode == 'official' }}
    permissions:
      contents: write
    runs-on: lynx-ubuntu-22.04-large
    steps:
      - name: Download Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: lynx
          ref: ${{ needs.get-version.outputs.checkout_ref }}
          fetch-depth: 0
      - name: Python Setup
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install Common Dependencies
        uses: ./lynx/.github/actions/common-deps
        with:
          cache-backend: github
          target: clay
      - name: Build Linux SDK
        run: |-
          cd $GITHUB_WORKSPACE/lynx
          source tools/envsetup.sh
          python3 platform/linux/build_release.py --target-cpu x64
      - name: push Linux SDK to release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: ${{ needs.get-version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: '${{ github.workspace }}/lynx/out/Default/lynx_sdk_linux_x64.zip,${{ github.workspace }}/lynx/out/Default/lynx_sdk_linux_x64.zip.sha256'
          allowUpdates: true
          updateOnlyUnreleased: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          draft: true

  windows-explorer-release:
    timeout-minutes: 60
    runs-on: lynx-windows-2022-large
    needs: get-version
    if: ${{ needs.get-version.outputs.release_mode == 'official' }}
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [x86, x64]
    steps:
      - name: Configure Git
        shell: PowerShell
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global http.sslBackend "schannel"
        working-directory: ./
      - name: Download Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: lynx
          ref: ${{ needs.get-version.outputs.checkout_ref }}
          fetch-depth: 0
      - name: Python Setup
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install Common Dependencies
        uses: ./lynx/.github/actions/windows-common-deps
        with:
          target: 'clay'
      - name: Build windows Explorer
        uses: ./lynx/.github/actions/windows-explorer-build
        with:
          build-arch: ${{ matrix.arch }}
      - name: push explorer to release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: ${{ needs.get-version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: '${{ github.workspace }}/lynx/LynxExplorer-windows-${{ matrix.arch }}.tar.gz,${{ github.workspace }}/lynx/out/Default/lynx_sdk_windows_${{ matrix.arch }}.zip'
          allowUpdates: true
          updateOnlyUnreleased: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          draft: true

  finalize-release:
    runs-on: ubuntu-22.04
    needs:
      - get-version
      - android-explorer-build
      - ios-explorer-build
      - harmony-explorer-build
      - android-sdk-release
      - ios-sdk-publish
      - cocoapods-lynx-library-publish
      - harmony-sdk-publish
      - macos-explorer-release
      - linux-sdk-release
      - windows-explorer-release
    if: ${{ always() && needs.get-version.outputs.release_mode == 'official' }}
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.get-version.outputs.release_id }}
      ANDROID_EXPLORER_RESULT: ${{ needs.android-explorer-build.result }}
      IOS_EXPLORER_RESULT: ${{ needs.ios-explorer-build.result }}
      HARMONY_EXPLORER_RESULT: ${{ needs.harmony-explorer-build.result }}
      ANDROID_SDK_RESULT: ${{ needs.android-sdk-release.result }}
      IOS_SDK_RESULT: ${{ needs.ios-sdk-publish.result }}
      COCOAPODS_LIBRARY_RESULT: ${{ needs.cocoapods-lynx-library-publish.result }}
      HARMONY_SDK_RESULT: ${{ needs.harmony-sdk-publish.result }}
      MACOS_EXPLORER_RESULT: ${{ needs.macos-explorer-release.result }}
      LINUX_SDK_RESULT: ${{ needs.linux-sdk-release.result }}
      WINDOWS_EXPLORER_RESULT: ${{ needs.windows-explorer-release.result }}
    steps:
      - name: Verify required release jobs
        shell: bash
        run: |-
          set -euo pipefail

          failed_jobs=()
          while IFS='=' read -r job result; do
            if [ "$result" != "success" ]; then
              failed_jobs+=("$job=$result")
            fi
          done <<EOF
          android-explorer-build=$ANDROID_EXPLORER_RESULT
          ios-explorer-build=$IOS_EXPLORER_RESULT
          harmony-explorer-build=$HARMONY_EXPLORER_RESULT
          android-sdk-release=$ANDROID_SDK_RESULT
          ios-sdk-publish=$IOS_SDK_RESULT
          cocoapods-lynx-library-publish=$COCOAPODS_LIBRARY_RESULT
          harmony-sdk-publish=$HARMONY_SDK_RESULT
          macos-explorer-release=$MACOS_EXPLORER_RESULT
          linux-sdk-release=$LINUX_SDK_RESULT
          windows-explorer-release=$WINDOWS_EXPLORER_RESULT
          EOF

          if [ "${#failed_jobs[@]}" -gt 0 ]; then
            printf 'Required release jobs did not succeed:\n'
            printf '  %s\n' "${failed_jobs[@]}"
            echo "The GitHub release remains a draft."
            exit 1
          fi

      - name: Publish GitHub release
        shell: bash
        run: |-
          set -euo pipefail

          if [ -z "$RELEASE_ID" ]; then
            echo "Release ID is missing."
            exit 1
          fi

          curl --silent --show-error --fail \
            --request PATCH \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"draft":false}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >/dev/null
          echo "Published GitHub release $RELEASE_ID."
