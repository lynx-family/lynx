name: lynx_core_publish

on: workflow_dispatch

jobs:
  lynx_types_publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: lynx
      - name: Python Setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install Common Dependencies
        uses: ./lynx/.github/actions/common-deps
        with:
          cache-backend: github
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Build
        run: |-
          cd $GITHUB_WORKSPACE/lynx
          source tools/envsetup.sh
          pushd js_libraries/lynx-runtime-shared
          npm run build
          popd
          pushd js_libraries/lynx-core
          npm run build:web
          popd
      - name: Publish
        run: |-
          cd $GITHUB_WORKSPACE/lynx/js_libraries/lynx-core
          npm publish --access public --provenance
