name: ci

on:
  pull_request:
    branches:
      - release/3.3
  push:
    branches:
      - CQ-*

defaults:
  run:
    working-directory: lynx

jobs:
  static-check:
    runs-on: lynx-ubuntu-22.04-medium
    steps:
      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

  release:
    uses: ./.github/workflows/publish-release.yml
    with:
      dry-run: false
      version: 3.3.3
    permissions:
      contents: write
    secrets: inherit
