name: ci

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - CQ-*

defaults:
  run:
    working-directory: lynx

jobs:
  test-generate-changelog:
    runs-on: lynx-ubuntu-22.04-medium
    timeout-minutes: 30
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          path: lynx
      - name: Generate Changelog
        uses: ./lynx/.github/actions/generate-changelog
        with:
          ref-from: 3.2.0
          ref-to: 3.3.0
          changelog-path: changelog/changelog1.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cat Changelog
        run: |-
          cat changelog/changelog1.md
