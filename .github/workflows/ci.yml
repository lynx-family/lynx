name: ci

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - CQ-*

jobs:
  get-version:
    runs-on: lynx-ubuntu-22.04-medium
    timeout-minutes: 60
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Get Version
        id: get_version
        run: |-
          echo "VERSION=3.3.1.alpha.1" >> $GITHUB_OUTPUT;

  android-explorer-build:
    timeout-minutes: 60
    runs-on: lynx-ubuntu-22.04-large
    needs: get-version
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          path: lynx
      - name: Build Explorer App
        uses: ./lynx/.github/actions/android-explorer-build
        with:
          abiList: armeabi-v7a,x86,x86_64,arm64-v8a

  ios-explorer-build:
    timeout-minutes: 60
    runs-on: lynx-darwin-14-medium
    needs: get-version
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          path: lynx
      - name: Build Explorer App
        uses: ./lynx/.github/actions/ios-explorer-build
        with:
          buildArch: ${{ matrix.arch }}

  harmony-explorer-build:
    runs-on: lynx-custom-dind
    container:
      image: ghcr.io/lynx-family/ubuntu24.04-harmony@sha256:601a0169922d3929a2f77cb0ceda89a3c76b168e1a95e2d419465b295ed2a1d6
      options: --cap-add=NET_ADMIN
      env:
        ACCESS_KEY: ${{ secrets.TOS_AP_ACCESS_KEY }}
        SECRET_KEY: ${{ secrets.TOS_AP_SECRET_KEY }}
        ENDPOINT: ${{ secrets.TOS_AP_ENDPOINT }}
        BUCKET_NAME: actions
        REGION: ${{ secrets.TOS_AP_REGION }}
      credentials:
        username: lynx-family
        password: ${{ secrets.GITHUB_TOKEN }}
    needs: get-version
    defaults:
      run:
        working-directory: ${{ github.workspace }}
        shell: bash
    steps:
      - name: Set MTU
        run: |
          sudo apt install --no-install-recommends -y iproute2 
          sudo ip link set dev eth0 mtu 1450
          echo "MTU set successfully"
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          path: lynx
      - name: change permission
        run: |
          sudo chmod 777 /
      - name: Build Explorer App
        uses: ./lynx/.github/actions/harmony-explorer-build
      - name: Check artifact
        run: |-
          cd $GITHUB_WORKSPACE/lynx
          pushd explorer/harmony/lynx_explorer/build/default/outputs/default/
          ls -la
          popd

  android-sdk-release:
    runs-on: lynx-ubuntu-22.04-large
    needs: get-version
    timeout-minutes: 60
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          path: lynx
      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Common Dependencies
        uses: ./lynx/.github/actions/common-deps
        with:
          cache-backend: 'lynx-infra'
      - name: Android SDK Release
        uses: ./lynx/.github/actions/android-sdk-release
        with:
          version: ${{ needs.get-version.outputs.version  }}
          signingKeyId: ${{ secrets.SIGNING_KEY_ID }}
          signingPassword: ${{ secrets.SIGNING_PASSWORD }}
          signingSecretKey: ${{ secrets.SIGNING_SECRET_KEY }}
          abiList: 'armeabi-v7a,x86,x86_64,arm64-v8a'
      - name: Package maven artifacts
        run: |-
          cd $GITHUB_WORKSPACE/lynx
          pushd platform/android
          ./gradlew zipArtifacts -Pversion=${{ needs.get-version.outputs.version  }} getArtifactList
          popd
          pushd platform/android/build
          artifact_list=$(<artifact-list)
          echo "::set-output name=artifact_list::$artifact_list"
          popd
        id: build_artifact
