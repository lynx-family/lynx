plugins {
    id 'com.android.library'
}
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply from: '../../../../platform/android/publish.gradle'
import org.json.simple.JSONObject
ext.enableDevtoolLogbox =
        providers.gradleProperty("devtool_enable_logbox").getOrElse("true").toBoolean()

android {

    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 26

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        packagingOptions {
            exclude 'lib/*/libdebugrouter.so'
            exclude 'lib/*/liblynxbase.so'
            exclude 'lib/*/liblynxtrace.so'
            if (!project.ext.enableDevtoolLogbox) {
                exclude 'assets/logbox'
                exclude 'assets/logbox/**'
                exclude 'logbox'
                exclude 'logbox/**'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            externalNativeBuild {
                cmake {
                    arguments '-DBUILD_TYPE=release'
                    abiFilters(*rootProject.ext.abiList)
                }
            }
        }

        debug {
            externalNativeBuild {
                cmake {
                    arguments '-DBUILD_TYPE=debug'
                    abiFilters(*rootProject.ext.abiList)
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    flavorDimensions "lynx"
    productFlavors {
        asan {
            dimension "lynx"
            externalNativeBuild {
                cmake {
                    arguments '-DFLAVOR_NAME=asan'
                    abiFilters(*rootProject.ext.abiList)
                }
            }
        }
        noasan {
            dimension "lynx"
            externalNativeBuild {
                cmake {
                    arguments '-DFLAVOR_NAME=noasan'
                    abiFilters(*rootProject.ext.abiList)
                }
            }
        }
    }


    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
}

task copyResources() {
    doLast {
        exec {
            workingDir '../../'
            commandLine pythonExec, './resources/copy_resources.py',
                    project.ext.enableDevtoolLogbox ? '--enable-logbox' : '--disable-logbox'
        }
        if (!project.ext.enableDevtoolLogbox) {
            delete "$projectDir/src/main/assets/logbox"
        }
    }
}

preBuild.dependsOn copyResources

project.afterEvaluate {
    project.android.libraryVariants.each {
        String flavorName = it.flavorName.capitalize()
        String buildTypeName = it.buildType.name.capitalize()
        String variantName = it.name
        tasks.getByName("package${flavorName}${buildTypeName}Assets") {
            it.doFirst {
                if (!project.ext.enableDevtoolLogbox) {
                    delete "$projectDir/src/main/assets/logbox"
                    delete "$buildDir/intermediates/library_assets/${variantName}/out/logbox"
                }
            }
        }
        tasks.getByName("bundle${flavorName}${buildTypeName}Aar") {
            it.doFirst {
                if (!project.ext.enableDevtoolLogbox) {
                    delete "$projectDir/src/main/assets/logbox"
                    delete "$buildDir/intermediates/library_assets/${variantName}/out/logbox"
                }
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
    compileOnly 'androidx.annotation:annotation:1.0.0'
    implementation 'org.lynxsdk.lynx:debug-router:0.0.20'
    implementation project(':LynxBase')
    implementation project(':LynxTrace')
}

// Configure the compilation parameters in gn to generate the corresponding CMakeLists.txt files.
task configGnCompileParas {
    def buildVariantList = getFlavorNamesAndBuildTypes(project)
    def flavorNames = buildVariantList[0]
    def buildTypes = buildVariantList[1]
    JSONObject gnBuildArgs_map = new JSONObject()
    flavorNames.each{
        JSONObject gnBuildArgsList = new JSONObject()
        String flavorName = it
        if (flavorName == "debugMode") {
            gnBuildArgsList.put("lynx_in_debug", "true")
        } else if(flavorName == "asan") {
            gnBuildArgsList.put("is_asan", "true")
        }
        buildTypes.each{
            JSONObject gnBuildArgs_list = new JSONObject(gnBuildArgsList)
            String buildType = it
            if (buildType == "release") {
            } else if(buildType == "debug") {
            }
            rootProject.ext.abiList.each { abi -> 
                gnBuildArgs_map.put(flavorName+buildType+abi, gnBuildArgs_list)
            }
        }
    }
    writeGnArgs(gnBuildArgs_map.toJSONString())
}
