summary: Applies an editable style value to a Lynx UI node through the platform helper.
parameters:
  - name: UINodeId
    type: integer
    description: Platform UI node id to mutate.
  - name: styleName
    type: string
    enum: [frame, margin, border, visible, background-color, border-color]
    description: Editable style name.
  - name: styleContent
    type: string
    description: Style value string. frame, margin, and border use four comma or whitespace separated numbers. color styles use eight-digit RGBA hex values. visible uses true or false on native Android, Darwin, and Clay renderers, while native Harmony also treats 0 as hidden.
returns: []
events: []
notes:
  - Requires UITree.enable first. If UI tree inspection is not enabled, the handler returns ServerError.
  - Dispatches through LynxDevToolMediator to InspectorUIExecutor on the UI thread.
  - The handler forwards params.UINodeId, params.styleName, and params.styleContent to DevToolPlatformFacade::SetUIStyle.
  - Missing or invalid UINodeId, styleName, or styleContent values return InvalidParams.
  - The response is an empty result object when the platform return value is not -1.
  - A platform return value of -1 produces a top-level ServerError.
  - Native Android, Darwin, native Harmony, and Clay renderers support frame, margin, border, visible, background-color, and border-color, but unsupported or invalid inputs do not produce identical platform return values.
  - If the mediator has no UI task runner or the platform facade is unavailable, the handler returns ServerError.
examples:
  - title: Update a UI frame
    request:
      id: 1
      method: UITree.setUIStyle
      params:
        UINodeId: 42
        styleName: frame
        styleContent: 0,0,100,50
    response:
      id: 1
      result: {}
  - title: Failed style update
    request:
      id: 2
      method: UITree.setUIStyle
      params:
        UINodeId: 42
        styleName: frame
        styleContent: invalid
    response:
      id: 2
      error:
        code: -32000
        message: Failed to set UI style
