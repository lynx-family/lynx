summary: Enables Lynx UI tree inspection methods on the current target.
parameters:
  - name: useCompression
    type: boolean
    optional: true
    default: false
    description: Whether UITree.getLynxUITree should compress a large root payload before returning it.
  - name: compressionThreshold
    type: integer
    optional: true
    default: 10240
    description: Root payload size in bytes above which UITree.getLynxUITree compresses the response when compression is enabled.
returns: []
events: []
notes:
  - Dispatches through LynxDevToolMediator to InspectorUIExecutor on the UI thread.
  - Sets the UI tree enabled flag used by UITree.getLynxUITree, UITree.getUIInfoForNode, and UITree.setUIStyle.
  - Returns an empty result object.
  - The default compression threshold before this method changes it is 10240 bytes.
  - If the mediator has no UI task runner, the current handler does not send an explicit CDP response.
examples:
  - title: Enable UI tree inspection
    request:
      id: 1
      method: UITree.enable
      params:
        useCompression: true
        compressionThreshold: 10240
    response:
      id: 1
      result: {}
