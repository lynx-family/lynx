summary: Returns the current initial template data exposed by the platform facade.
parameters: []
returns:
  - name: content
    type: string
    description: Serialized template data produced from the platform Lepus value. This field is present only when the platform facade returns a non-null template data value.
events: []
notes:
  - Dispatches through LynxDevToolMediator to InspectorUIExecutor on the UI thread.
  - Android reads the saved initial TemplateData pointer from the platform reload helper; Darwin delegates to the platform implementation.
  - If the platform facade has no template data value, the result object is returned without content.
examples:
  - title: Get current template data
    request:
      id: 1
      method: Template.templateData
    response:
      id: 1
      result:
        content: '{"title":"hello"}'
