summary: Transfers a template data fragment to the platform reload helper.
parameters:
  - name: dataType
    type: string
    enum: [template]
    description: Data category. The native handler only processes the value template.
  - name: data
    type: string
    description: Template fragment data to pass to the platform facade.
  - name: eof
    type: boolean
    description: Whether this fragment is the final template fragment.
returns: []
events: []
notes:
  - Dispatches through LynxDevToolMediator to InspectorUIExecutor on the UI thread.
  - The handler forwards data only when params.dataType is template, params.data is a string, and params.eof is a boolean.
  - Matching requests call DevToolPlatformFacade::OnReceiveTemplateFragment(data, eof).
  - Missing params, unsupported dataType values, or invalid field types are ignored and return an empty CDP result object.
  - Valid template fragments return an empty CDP result object after being forwarded.
  - If the UI task runner or UI executor is unavailable, or a valid fragment requires an unavailable platform facade, the handler returns a ServerError.
examples:
  - title: Transfer a template fragment
    request:
      id: 1
      method: Lynx.transferData
      params:
        dataType: template
        data: '<binary-or-encoded-template-fragment>'
        eof: false
    response:
      id: 1
      result: {}
