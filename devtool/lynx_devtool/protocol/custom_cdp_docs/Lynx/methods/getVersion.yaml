summary: Returns the Lynx engine version string reported by the platform.
parameters: []
returns:
  - name: result
    type: string
    description: Lynx version string returned directly as the CDP result value.
events: []
notes:
  - Dispatches through LynxDevToolMediator to InspectorDefaultExecutor on the DevTool thread.
  - The response result is a string value, not an object wrapper.
  - Android delegates to DevToolPlatformAndroidDelegate.getLynxVersion(). Darwin delegates to LynxDeviceInfoHelper.getLynxVersion().
  - The native implementation does not read request params.
  - If the DevTool task runner, default executor, or platform facade is unavailable, the handler returns a ServerError.
examples:
  - title: Read the Lynx version
    request:
      id: 1
      method: Lynx.getVersion
    response:
      id: 1
      result: '1.1.5'
