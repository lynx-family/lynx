summary: Ends TestBench replay by exposing a replay dump file as a stream.
parameters:
  - name: params
    type: string
    description: File path for the replay dump file. The native handler reads the whole params value as this string.
returns:
  - name: stream
    type: string
    description: FileStream handle returned in the command result on success.
events:
  - Replay.end
notes:
  - Replay support must be enabled in the current runtime. If ReplayController::Enable() is false, the agent returns method not implemented.
  - params is a raw string file path, not an object.
  - On command success, LynxGlobalDevToolMediator opens the file with FileStream::Open() and returns the handle in result.stream.
  - Read the returned stream handle with IO.read and close it with IO.close.
  - If the file path cannot be opened, the method returns a CDP error with message file path doesn't exist.
  - If ReplayController::Enable() is false in the mediator, the method returns a CDP error with message Replay doesn't enable.
  - In the internal replay workflow, ReplayController::EndTest() saves collected replay dump data before sending a Replay.end event whose params.stream contains the stream handle.
examples:
  - title: End replay and open the dump file
    request:
      id: 2
      method: Replay.end
      params: /tmp/lynx-replay-dump.json
    response:
      id: 2
      result:
        stream: '1'
  - title: Internal replay completion event
    response:
      method: Replay.end
      params:
        stream: '1'
