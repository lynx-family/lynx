summary: Exposes the latest TestBench replay dump file as a stream.
parameters:
  - name: params
    type: string
    optional: true
    description: Ignored. Earlier versions treated this value as a file path; the dump file is now always chosen by the native replay workflow.
returns:
  - name: stream
    type: string
    description: FileStream handle returned in the Replay.end message params on success.
events:
  - Replay.end
notes:
  - Replay support must be enabled in the current runtime. If ReplayController::Enable() is false, the agent returns method not implemented.
  - The request cannot choose which file to open. Any params value is ignored, and a warning is logged when params is present.
  - On success, LynxGlobalDevToolMediator opens the latest replay dump file with FileStream::Open() and sends a Replay.end message whose params.stream is the stream handle.
  - Read the returned stream handle with IO.read and close it with IO.close.
  - If no replay has finished yet, the method returns a CDP error with message Replay dump file is not available.
  - If the latest replay dump file cannot be opened, the method returns a CDP error with message Replay dump file doesn't exist.
  - If ReplayController::Enable() becomes false inside the mediator task, the method returns a CDP error with message Replay doesn't enable.
  - In the internal replay workflow, ReplayController::EndTest() saves collected replay dump data to a path chosen by the platform, then DevTool sends the same Replay.end message shape without a request.
examples:
  - title: Open the latest replay dump file
    request:
      id: 2
      method: Replay.end
    response:
      method: Replay.end
      params:
        stream: '1'
