summary: Queries monitored Lynx memory across live instances and destroyed pages with residual memory.
parameters:
  - name: timeoutMs
    type: integer
    optional: true
    minimum: 0
    maximum: 300000
    description: Non-negative integer timeout in milliseconds. Omit the field or pass 0 to let the platform bridge choose its default wait policy. Android and Darwin currently use 2000 ms when the bridge receives 0.
returns:
  - name: collectionStartMs
    type: integer
    description: Wall-clock collection start time in milliseconds, as reported by the platform memory collector.
  - name: collectionStatus
    type: string
    enum: [completed, timeout, error]
    description: Status of the native global snapshot. SDK failures carry errorMessage; DevTool forwards failures as CDP errors.
  - name: errorMessage
    type: string
    description: Empty on success; describes a failed SDK query.
  - name: collectionDurationMs
    type: integer
    description: Elapsed collection time in milliseconds.
  - name: collectionTimeoutMs
    type: integer
    description: Timeout in milliseconds used by the platform collector for this request.
  - name: expectedInstanceCount
    type: integer
    description: Number of active instances in the native snapshot.
  - name: completedInstanceCount
    type: integer
    description: Number of completed instance results included in this response.
  - name: totalBytes
    type: integer
    description: Global Lynx-attributed bytes. The total includes element, view, main-thread runtime, and background-thread runtime bytes, and excludes appBytes.
  - name: appBytes
    type: integer
    description: Current app memory footprint in bytes when the platform reports it.
  - name: ratioToApp
    type: number
    description: Global Lynx-attributed totalBytes divided by appBytes. Zero when appBytes is unavailable.
  - name: elementBytes
    type: integer
    description: Aggregated element memory in bytes across completed instance results.
  - name: elementNodeCount
    type: integer
    description: Aggregated element node count across completed instance results.
  - name: viewBytes
    type: integer
    description: Aggregated UI view memory in bytes across completed instance results.
  - name: mainThreadRuntimeBytes
    type: integer
    description: Aggregated main-thread runtime heap bytes across completed instance results.
  - name: backgroundThreadRuntimeBytes
    type: integer
    description: Aggregated background-thread runtime heap bytes. Shared background runtime groups are counted once in the global total.
  - name: instances
    type: array
    description: Completed instance memory usage results, sorted by totalBytes descending by the platform result object.
  - name: 'instances[].instanceId'
    type: integer
    description: LynxShell instance id. A value of -1 means the instance was not fully attached.
  - name: 'instances[].pageId'
    type: string
    description: Native memory-monitor page_key. Empty when unavailable.
  - name: 'instances[].url'
    type: string
    description: Current template URL captured when the instance fetcher completes. Empty when unavailable.
  - name: 'instances[].totalBytes'
    type: integer
    description: Instance-attributed total bytes, including element, view, main runtime, and background runtime bytes.
  - name: 'instances[].elementBytes'
    type: integer
    description: Element tree memory in bytes reported for the instance.
  - name: 'instances[].elementNodeCount'
    type: integer
    description: Element node count for the instance.
  - name: 'instances[].viewBytes'
    type: integer
    description: UI view memory in bytes reported for the instance.
  - name: 'instances[].viewDetail'
    type: object
    description: Per-view-category memory detail. Object keys are view categories or tags.
  - name: 'instances[].viewDetail.<key>.category'
    type: string
    description: View memory category name.
  - name: 'instances[].viewDetail.<key>.sizeBytes'
    type: integer
    description: Memory size in bytes for the view category.
  - name: 'instances[].viewDetail.<key>.instanceCount'
    type: integer
    description: Number of view instances in this category.
  - name: 'instances[].viewDetail.<key>.detail'
    type: object
    description: Category-specific string map reported by the platform memory record.
  - name: 'instances[].mainThreadRuntimeBytes'
    type: integer
    description: Main-thread runtime heap snapshot bytes for the instance.
  - name: 'instances[].backgroundThreadRuntimeBytes'
    type: integer
    description: Background-thread runtime heap snapshot bytes for the instance.
  - name: 'instances[].btsRuntimeGroupId'
    type: string
    description: Background runtime group for diagnostics. Same-name VMs remain distinct.
  - name: 'instances[].btsRuntimeType'
    type: string
    enum: [quickjs, v8, jsvm, jsc, unknown]
    description: BTS engine type.
  - name: 'instances[].btsRuntimeTotalBytes'
    type: integer
    description: Whole BTS VM heap, separate from page-attributed backgroundThreadRuntimeBytes. Zero when unavailable.
  - name: destroyedInstances
    type: array
    description: Up to five destroyed tracked pages per shared QuickJS VM with current slot bytes at least 1024, ordered within each VM by bytes descending. Reuses the instance type but omits totalBytes, elementBytes, elementNodeCount, viewBytes, viewDetail, mainThreadRuntimeBytes, and backgroundThreadRuntimeBytes. Excluded from global totals and instance counts.
  - name: 'destroyedInstances[].instanceId'
    type: integer
    description: Exited LynxShell instance id.
  - name: 'destroyedInstances[].pageId'
    type: string
    description: Exited page's native memory-monitor page_key.
  - name: 'destroyedInstances[].url'
    type: string
    description: Original host URL, including query and fragment.
  - name: 'destroyedInstances[].btsRuntimeGroupId'
    type: string
    description: Background runtime group for diagnostics.
  - name: 'destroyedInstances[].btsRuntimeType'
    type: string
    description: quickjs.
  - name: 'destroyedInstances[].btsRuntimeTotalBytes'
    type: integer
    description: Whole BTS VM heap. Zero when unavailable.
  - name: 'destroyedInstances[].backgroundThreadRuntimeResidualBytes'
    type: integer
    description: Latest cached page slot bytes; not necessarily measured after a full GC.
events: []
notes:
  - Send this method to the global DevTool handler with session ID -1.
  - The mediator validates params.timeoutMs before dispatch. Non-object params, non-integer timeoutMs, negative timeoutMs, and timeoutMs values greater than 300000 return CDP errors.
  - The platform bridge returns only the result object as JSON. The mediator parses that object and wraps it in the CDP response envelope with the original request id.
  - Runtimes without a platform memory bridge return a CDP error instead of a partial memory result.
  - Disabled MemoryMonitor returns an SDK error and a CDP error. Production callers should query only processes selected for monitoring.
  - A DevTool connection continues to force-enable monitoring for local debugging.
  - Queries do not trigger GC. Heap queries refresh supported VM heaps on their owning JS runners; residual slot data comes from the latest monitor callback.
  - This method differs from Runtime.getHeapUsage, which reports JavaScript heap usage for one target runtime.
examples:
  - title: Use the platform default timeout
    request:
      id: 1
      method: Memory.getAllMemoryUsage
  - title: Use an explicit timeout
    request:
      id: 2
      method: Memory.getAllMemoryUsage
      params:
        timeoutMs: 50000
