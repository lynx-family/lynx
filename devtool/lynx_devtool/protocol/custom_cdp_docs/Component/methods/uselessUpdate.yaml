summary: Echoes a Component.uselessUpdate message with the request params.
parameters:
  - name: params
    type: object
    optional: true
    description: Opaque payload copied from the request params field into the Component.uselessUpdate notification.
returns: []
events:
  - Component.uselessUpdate
notes:
  - The handler first sends a Component.uselessUpdate notification with params copied from the request.
  - The handler then returns an empty CDP result object with the request id.
  - The native implementation does not inspect or validate the params payload.
examples:
  - title: Echo a component update payload
    request:
      id: 1
      method: Component.uselessUpdate
      params:
        componentId: comp-1
        reason: debug
    response:
      id: 1
      result: {}
  - title: Component update notification
    response:
      method: Component.uselessUpdate
      params:
        componentId: comp-1
        reason: debug
