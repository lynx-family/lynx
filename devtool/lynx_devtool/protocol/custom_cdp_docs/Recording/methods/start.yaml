summary: Starts TestBench recording for Lynx page interactions.
parameters:
  - name: format
    type: string
    enum: [json, both, fixture]
    optional: true
    description: Output artifact format. json writes the V1 recording, both writes V1 JSON and fixture ZIP, and fixture writes only fixture ZIP. Defaults to json.
returns: []
events: []
notes:
  - Recorder support must be compiled into the runtime to produce artifacts. When RecorderController::Enable() is false, format=fixture and format=both return a CDP error; format=json keeps its historical best-effort behavior and succeeds even though the controller is a no-op.
  - Dispatches through LynxGlobalDevToolMediator and starts RecorderController::StartRecord(format) on the UI task runner.
  - Returns an empty result object on success.
  - Returns a CDP error when params is not an object, format is not a string, format is not json, both, or fixture, fixture/both is requested on a recorder-disabled build, or no UI task runner is available.
examples:
  - title: Start V1 JSON recording
    request:
      id: 1
      method: Recording.start
    response:
      id: 1
      result: {}
  - title: Start dual-artifact recording
    request:
      id: 2
      method: Recording.start
      params:
        format: both
    response:
      id: 2
      result: {}
