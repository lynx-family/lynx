summary: Synthesizes a two-pointer touch pinch sequence through the platform input target.
parameters:
  - name: x
    type: number
    description: Finite horizontal logical coordinate of the pinch center relative to the LynxView on Clay desktop, or its containing native window on mobile.
  - name: y
    type: number
    description: Finite vertical logical coordinate of the pinch center relative to the LynxView on Clay desktop, or its containing native window on mobile.
  - name: scaleFactor
    type: number
    description: Finite positive ratio of the final distance between the two pointers to their initial distance. Values greater than 1 move the pointers apart, values less than 1 move them together, and 1 completes successfully without injecting an event.
  - name: relativeSpeed
    type: integer
    optional: true
    default: 800
    minimum: 1
    description: Rate in logical pixels per second at which the distance between the two pointers changes.
  - name: gestureSourceType
    type: string
    optional: true
    default: default
    enum: [default, touch, mouse]
    description: Pointer source to request. The default value resolves to the preferred source reported by the current platform target.
returns: []
events: []
notes:
  - Clay desktop uses logical pixels relative to the top-left of the target LynxView, independent of screenshot mode. Pass gestureSourceType touch because the Clay target keeps mouse as its default source.
  - Clay converts both touch points using the renderer pixel ratio and dispatches them through its pointer pipeline. Do not add the LynxView window offset. The gesture does not target unrelated native host controls.
  - Mobile targets use window-local logical coordinates. Android and Harmony convert them to native pixels using the window density or pixel ratio. iOS uses window points when an optional platform-specific pointer injection implementation is linked; otherwise it advertises no touch support.
  - Coordinates are not absolute screen coordinates or physical screenshot pixels. On mobile, convert LynxView-local coordinates to the containing window coordinate space before sending the request.
  - The two pointers start on a horizontal line at x minus 50 and x plus 50, giving an initial separation of 100 logical pixels. They move symmetrically around the center and finish at x minus 50 times scaleFactor and x plus 50 times scaleFactor.
  - On mobile, injection is dispatched through the native window or root view. A native overlay above the LynxView can receive the pinch, and the request cannot target content in a different native window.
  - Every generated pointer position must remain inside the selected target bounds. Otherwise the request fails and active pointers are cancelled.
  - Lynx currently supports only the touch source for pinch gestures. The resolved target must advertise touch support and at least two simultaneous touch points. Requesting mouse, or resolving default to a non-touch source, returns a CDP server error.
  - Mouse or touchpad wheel pinch is not implemented. Requesting gestureSourceType mouse returns an unsupported-source error.
  - The gesture duration is derived from the change in pointer separation and relativeSpeed. The actual elapsed duration may be longer because pointer movement is frame-driven.
  - The request completes after all pointer events have been accepted by the current platform target; it does not guarantee that the native UI or page script has consumed the events.
examples:
  - title: Pinch outward with touch input
    request:
      id: 1
      method: Input.synthesizePinchGesture
      params:
        x: 200
        y: 300
        scaleFactor: 2
        gestureSourceType: touch
    response:
      id: 1
      result: {}
  - title: Pinch inward with an explicit touch source
    request:
      id: 2
      method: Input.synthesizePinchGesture
      params:
        x: 200
        y: 300
        scaleFactor: 0.5
        relativeSpeed: 400
        gestureSourceType: touch
    response:
      id: 2
      result: {}
