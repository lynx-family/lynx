summary: Synthesizes one or more single-pointer tap sequences through the platform input target.
parameters:
  - name: x
    type: number
    description: Finite horizontal logical coordinate relative to the LynxView on Clay desktop, or its containing native window on mobile.
  - name: y
    type: number
    description: Finite vertical logical coordinate relative to the LynxView on Clay desktop, or its containing native window on mobile.
  - name: duration
    type: integer
    optional: true
    default: 50
    minimum: 0
    description: Minimum time in milliseconds between the pointer-down and pointer-up events of each tap.
  - name: tapCount
    type: integer
    optional: true
    default: 1
    minimum: 0
    maximum: 200
    description: Number of independent tap sequences to perform. Passing 0 completes successfully without injecting an event.
  - name: gestureSourceType
    type: string
    optional: true
    default: default
    enum: [default, touch, mouse]
    description: Pointer source to request. The default value resolves to the preferred source reported by the current platform target.
returns: []
events: []
notes:
  - Clay desktop (macOS, Windows, and windowless renderers) uses logical pixels relative to the top-left of the target LynxView, independent of screenshot mode. The target defaults to mouse and supports primary mouse taps plus up to two synthetic touch points.
  - Clay converts coordinates once using the current viewport pixel ratio and dispatches through its pointer pipeline. Do not add the LynxView window offset. Input participates in Clay hit testing and gesture recognition; it is not native window input and does not target unrelated host controls.
  - Clay requires a valid renderer viewport and a point inside its bounds. Resizing or changing the pixel ratio during a pressed gesture cancels that gesture. Resetting or destroying the renderer also cancels pressed input.
  - Mobile targets use window-local logical coordinates. Android and Harmony convert them to native pixels using the window density or pixel ratio. iOS uses window points when an optional platform-specific pointer injection implementation is linked; otherwise it advertises no touch support.
  - Coordinates are not absolute screen coordinates or physical screenshot pixels. On mobile, convert LynxView-local coordinates to the containing window coordinate space before sending the request.
  - On mobile, injection is dispatched through the native window or root view. A native overlay above the LynxView can receive the tap. The LynxView must be attached to a valid native window and the point must fall inside that window.
  - Explicitly requesting a pointer source that the current platform target does not advertise returns a CDP server error. Targets with native touch injection support normally resolve default to touch.
  - Each tap is an independent single-pointer down/up sequence. tapCount does not create multiple simultaneous pointers.
  - The actual elapsed duration may exceed duration because pointer injection is frame-driven. The request completes after every tap event has been accepted by the current platform target; it does not guarantee that the native UI or page script has consumed the event.
  - The product of duration and tapCount must not exceed 10000 milliseconds.
examples:
  - title: Tap once with platform defaults
    request:
      id: 1
      method: Input.synthesizeTapGesture
      params:
        x: 120
        y: 240
    response:
      id: 1
      result: {}
  - title: Perform two touch taps
    request:
      id: 2
      method: Input.synthesizeTapGesture
      params:
        x: 120
        y: 240
        duration: 100
        tapCount: 2
        gestureSourceType: touch
    response:
      id: 2
      result: {}
