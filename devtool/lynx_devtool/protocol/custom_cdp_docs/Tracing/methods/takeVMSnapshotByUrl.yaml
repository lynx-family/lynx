summary: Take snapshot of MTS or BTS virtual machines of page with given URL.
parameters:
  - name: url
    type: string
    description: The url of page to take snapshot.
  - name: type
    type: string
    description: Type of the snapshot to take. 'bts' or 'mts'.
returns: []
events: []
notes:
  - Dispatches through LynxGlobalDevToolMediator on the global DevTool task runner.
  - Returns an empty OK response when tracing session is active and params.url and params.type are strings.
  - Missing or non-string params.url or params.type returns InvalidParams with message 'Invalid url or type: expected strings'.
  - An inactive tracing session returns ServerError with message 'Tracing is not started'.
  - Returns ServerError with message Cannot find default task runner when the global mediator cannot dispatch the command.
examples:
  - title: Take snapshot of page with given URL
    request:
      id: 1
      method: Tracing.takeVMSnapshotByUrl
      params:
        url: https://example.com/template.js
        type: bts
    response:
      id: 1
      result: {}
