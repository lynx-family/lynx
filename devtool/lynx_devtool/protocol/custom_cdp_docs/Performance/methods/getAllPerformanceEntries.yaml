summary: Returns DevTool-recorded Lynx performance entries for the current page.
parameters: []
returns:
  - name: entries
    type: array
    description: Performance entry objects recorded by the Lynx performance controller.
  - name: 'entries[].entryType'
    type: string
    description: Entry type. The native DevTool cache currently records pipeline entries.
  - name: 'entries[].instanceId'
    type: integer
    description: Lynx instance id added by PerformanceController before the entry is cached.
  - name: 'entries[].name'
    type: string
    optional: true
    description: Entry name generated by the timing pipeline, usually derived from the pipeline origin.
  - name: 'entries[].frameworkRenderingTiming'
    type: object
    optional: true
    description: Timing markers supplied by the frontend framework.
  - name: 'entries[].hostPlatformTiming'
    type: object
    optional: true
    description: Timing markers supplied by the host platform.
events: []
notes:
  - Registered in devtool/lynx_devtool/agent/domain_agent/inspector_performance_agent.cc.
  - Dispatches through LynxDevToolMediator to InspectorUIExecutor on the UI thread.
  - The executor reads LynxShell::GetAllPerformanceEntries() and wraps the converted array as result.entries.
  - PerformanceController only caches pipeline entries when LynxEnv DevTool is enabled. This is independent of the CDP Performance.enable method.
  - The method returns an empty entries array when there are no cached entries.
  - Cached entries are cleared by PerformanceController::ResetStateBeforeReload().
  - The entry object is extensible. Fields beyond entryType, instanceId, name, frameworkRenderingTiming, and hostPlatformTiming are owned by the Timing API and may vary by pipeline type.
  - The native implementation does not read request params.
  - If the shell has already been destroyed, the current handler sends a response with the request id and no result object.
examples:
  - title: Read recorded performance entries
    request:
      id: 1
      method: Performance.getAllPerformanceEntries
    response:
      id: 1
      result:
        entries:
          - entryType: pipeline
            instanceId: 1001
            name: loadBundle
            frameworkRenderingTiming: {}
            hostPlatformTiming: {}
