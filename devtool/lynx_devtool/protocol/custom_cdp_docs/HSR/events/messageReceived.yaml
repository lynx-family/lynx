summary: Publishes an opaque string message from the host runtime on the global channel.
parameters:
  - name: message
    type: string
    description: Message provided by the runtime, unchanged. Empty strings are allowed.
notes:
  - Native host/runtime code may call GlobalDevToolPlatformFacade::SendHSRMessageReceived from any thread. Delivery runs on the DevTool thread through the existing global MessageSender (session -1).
  - Events may be sent without a preceding command. There is no enable method or additional subscription in this domain.
  - Delivery follows the existing global channel's connection behavior. This domain adds no buffering or replay.
  - Events have no CDP request id and do not imply completion of a particular command. Applications may encode correlation information in the message string.
  - loadScript and evaluate still complete through their own responses. The sendMessage command is not provided.
  - On the Android process runtime, __hostScriptThread.emitEvent(object) publishes an explicit script event after HSR.loadScript or HSR.evaluate connects the transport. It copies the JSON object on its owning thread; circular values, non-object JSON results, and payloads over 64 KiB are rejected. Standard JSON.stringify semantics apply to object properties.
  - Script events encode a JSON object in message with version 1, thread (bts/mts/ui), runtimeId (decimal string), and payload (the script's object). The native opaque-string publishing API remains compatible.
  - A replaced or stopped runtime's queued script events are discarded before transport delivery. No automatic console or exception forwarding is enabled.
  - Android interceptor.on('view.error', callback) observes copied viewId, code, message, and level fields on initialized process runtimes. Level preserves the platform severity, or is empty when unavailable. Notifications are asynchronous, have no replay, and cannot alter or suppress the original page error. Dispose the returned subscription to stop observing.
examples:
  - title: Runtime announces readiness
    event:
      method: HSR.messageReceived
      params:
        message: ready
  - title: Script explicitly publishes a page error
    event:
      method: HSR.messageReceived
      params:
        message: '{"version":1,"thread":"bts","runtimeId":"7","payload":{"type":"lynx.error","level":"error","viewId":"42","code":1001,"message":"page failed"}}'
