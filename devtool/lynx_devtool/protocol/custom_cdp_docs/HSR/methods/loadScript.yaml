summary: Loads or replaces the selected Host Script context while preserving live View bindings.
parameters:
  - name: source
    type: object
    description: 'Exactly one source: {type: inline, script: string} or {type: url, url: string}. Empty inline scripts are allowed; resource URLs must be non-empty. File URLs also use type: url.'
  - name: thread
    type: string
    optional: true
    description: 'Host Script control context to replace: bts (default), mts, or ui. The other two control contexts are preserved.'
returns: []
notes:
  - Uses the global CDP channel (session -1), not a page Runtime.
  - Android requires the debugMode engine and an enabled debugging lifecycle. Script execution in ordinary engines reports HSR_DEBUG_LIBRARY_REQUIRED; other platforms retain their default runtime-not-connected response.
  - Resource URLs are passed unchanged to the execution boundary, which reuses the platform ResourceFetcher for scheme handling and source loading. Supported schemes and file access depend on that fetcher; the transport does not parse or decode resource URLs.
  - Android uses the process-wide external JS resource provider registered in LynxEnv. A missing provider or unsupported scheme is an execution error. Source fetching runs on the existing IO executor and expires after 30 seconds; late resource callbacks are ignored.
  - Source must be valid UTF-8 and at most 512 KiB. Fetching and byte validation happen before replacing the selected context, so resource failures preserve its previous script.
  - Replacement clears only the selected control context and its old callbacks, reuses its configured runner and bindings, and executes the new entry in that context. Globals, callbacks, and registrations in the other two contexts are preserved. Live Views and page JS contexts are not destroyed.
  - Success means synchronous entry execution finished. The entry completion value is ignored, including Promise values; asynchronous work is not awaited. A script exception cleans up only the failed replacement without restoring its previous script; another load can retry.
  - Missing, contradictory, or incorrectly typed source fields, and a thread other than bts, mts, or ui, return InvalidParams (-32602). Unsupported platform file access is an execution error.
  - Runtime failures and abandoned callbacks return ServerError (-32000); malformed completion results return InternalError (-32603).
  - Host schema routers decode target=script with script or target=url with url, and an optional thread, into LoadHSRScriptFromSchema, sharing the same load boundary. Android exposes this through GlobalDevToolPlatformAndroidDelegate.loadHSRScriptFromSchema with a UI-thread completion callback. Concrete app scheme registration is host-owned.
  - Another load is rejected with HSR_LOAD_IN_PROGRESS until the current request completes. Evaluation in the context being replaced is rejected with RUNTIME_LOADING; evaluation in the other two contexts continues. Disabling debugging cancels replacement. Resource loads use the debug state at execution time and are not tied to the debug lifecycle in which fetching began.
  - Client timeout does not cancel running JavaScript.
examples:
  - title: Replace the UI control script on Android
    request:
      id: 1
      method: HSR.loadScript
      params:
        thread: ui
        source:
          type: inline
          script: globalThis.count = 1;
    response:
      id: 1
      result: {}
