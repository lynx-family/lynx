apply plugin: 'maven-publish'
apply plugin: 'signing'
import org.gradle.api.internal.artifacts.dependencies.DefaultExternalModuleDependency
import org.gradle.api.internal.artifacts.dependencies.DefaultProjectDependency

def aarPathList=""

def baseVersion = findProperty("version")
def devVersion = "${baseVersion}-dev"

if (findProperty("ARTIFACT_GROUP") != null) {
    project.group = ARTIFACT_GROUP
}
if (baseVersion != null) {
    project.version = baseVersion
}

def getAARPath(buildPath, boolean isDev = false) {
    def filePattern
    if (isDev) {
        filePattern = "**/*dev-release.aar"
    } else {
        def hasNoasanFlavor = project.android.productFlavors.any { it.name == "noasan" }
        filePattern = hasNoasanFlavor ? "**/*noasan-release.aar" : "**/*release.aar"
    }
    FileTree fileTree = project.fileTree(dir: buildPath, includes: [filePattern])
    if (fileTree.isEmpty()) {
        throw new GradleException("No AAR found in path '${buildPath}' with pattern '${filePattern}'")
    }
    return fileTree.files[0]
}

def getPublishRepositoryBaseDir = {
    rootProject.file("${rootProject.buildDir}/release")
}
def getPublishRepositoryVersionDir = { String version ->
    rootProject.file("${rootProject.buildDir}/release/${version}")
}
def isSnapshotVersion = { String version ->
    version != null && version.endsWith("-SNAPSHOT")
}
def getCentralTokenUsername = {
    findProperty("centralTokenUsername") ?: System.getenv("CENTRAL_TOKEN_USERNAME")
}
def getCentralTokenPassword = {
    findProperty("centralTokenPassword") ?: System.getenv("CENTRAL_TOKEN_PASSWORD")
}

boolean isJavaModule() {
    boolean result = ((project.plugins.hasPlugin('java-library')
            || project.plugins.hasPlugin('java'))
            && !isAndroidModule())
    return result
}

boolean isAndroidModule() {
    boolean result = project.plugins.hasPlugin('com.android.library')
    return result
}

boolean isGradlePluginModule() {
    boolean result = project.plugins.hasPlugin('java-gradle-plugin')
    return result
}

boolean hasDevFlavor() {
    if (!isAndroidModule() || !project.android.productFlavors.any { it.name == "dev" }) {
        return false
    }
    def executedTasks = gradle.startParameter.taskNames*.toLowerCase()    
    boolean isDevTaskExecuted = executedTasks.any { taskName ->
        taskName.contains("dev")
    }
    return isDevTaskExecuted
}

Task createJavaSourceJar() {
    Task existingTask = project.tasks.findByName("sourceJar")
    if (existingTask != null) {
        return existingTask
    }
    return project.tasks.create("sourceJar", Jar) {
        if (project.gradle.gradleVersion >= '8.0') {
            it.setArchiveClassifier('sources')
        } else {
            classifier = 'sources'
        }
        from sourceSets.main.allSource
    }
}

Task createJavaJavadocJar() {
    Task existingTask = project.tasks.findByName("javadocJar")
    if (existingTask != null) {
        return existingTask
    }
    return project.tasks.create("javadocJar", Jar) {
        if (project.gradle.gradleVersion >= '8.0') {
            it.setArchiveClassifier('javadoc')
        } else {
            classifier = 'javadoc'
        }
        from sourceSets.main.java
    }
}

Task createSourceJar(String baseName) {
    return project.tasks.create("${baseName}Jar", Jar) {
        if (project.gradle.gradleVersion >= '8.0') {
            archiveBaseName = baseName
            it.setArchiveClassifier('sources')
        } else {
            baseName = baseName
            classifier = 'sources'
        }

        project.android.libraryVariants.all { variant ->
            try {
                from variant.variantData.javaSources.collect { it.getDir() }
            } catch (Exception e) {
                from variant.sourceSets.collect { it.java.getSrcDirs() }
            }
        }

        exclude '**/BuildConfig.java'
        exclude '**/R.java'
    }
}

def configurePomMetadata(publication) {
    publication.pom {
        name = publication.artifactId
        url = REPOSITORY_URL
        description = DESCRIPTION
        licenses {
            license {
                name = 'The Apache License, version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                name = DEVELOPER_NAME
                email = DEVELOPER_EMAIL
            }
        }
        scm {
            url = REPOSITORY_URL
            connection = "scm:git:git://$REPOSITORY_SSH_URL"
            developerConnection = "scm:git:ssh://$REPOSITORY_SSH_URL"
        }
    }
}

def configureSigningForPublications() {
    def signingKeyId = findProperty("signing.keyId")
    def signingPassword = findProperty("signing.password")
    def signingSecretKey = findProperty("signing.secretKey")
    if (signingKeyId != null && signingKeyId != "") {
        signing {
            useInMemoryPgpKeys(signingKeyId, signingSecretKey, signingPassword)
            sign publishing.publications
        }
    }
}

def addDependenciesToPom(Node pomNode) {
    def dependenciesNode = pomNode.appendNode('dependencies')
    configurations.implementation.allDependencies.each { dependency ->
        if (dependency instanceof DefaultExternalModuleDependency) {
            def dependencyNode = dependenciesNode.appendNode('dependency')
            dependencyNode.appendNode('groupId', dependency.group)
            dependencyNode.appendNode('artifactId', dependency.name)
            dependencyNode.appendNode('version', dependency.version)
            dependencyNode.appendNode('scope', 'runtime')
        } else if (dependency instanceof DefaultProjectDependency) {
            String scope = "runtime"
            if (configurations.api.dependencies.contains(dependency)) {
                scope = "compile"
            }
            def project = project(":${dependency.dependencyProject.path}")
            def artifactId = project.findProperty('ARTIFACT_NAME')
            def groupId = project.findProperty('ARTIFACT_GROUP')
            def dependencyNode = dependenciesNode.appendNode('dependency')
            dependencyNode.appendNode('groupId', groupId)
            dependencyNode.appendNode('artifactId', artifactId)
            dependencyNode.appendNode('version', dependency.version)
            dependencyNode.appendNode('scope', scope)
        }
    }
}

afterEvaluate {
    def runTasks = gradle.startParameter.taskNames.toString().toLowerCase()
    // Only tasks whose names contain "publish" can be triggered to avoid other Gradle tasks from executing this section of logic.
    if (runTasks.contains("publish")) {
        publishing {
            publications {
                if (isGradlePluginModule()) {
                    withType(MavenPublication).all { publication ->
                        if (publication.name == "pluginMaven") {
                            groupId ARTIFACT_GROUP
                            artifactId ARTIFACT_NAME
                            version findProperty("version")
                            artifact(createJavaSourceJar())
                            artifact(createJavaJavadocJar())
                        } else if (publication.name.endsWith("PluginMarkerMaven")) {
                            version findProperty("version")
                        }
                    }
                } else if (isJavaModule()) {
                    "jar"(MavenPublication) {
                        groupId ARTIFACT_GROUP
                        artifactId ARTIFACT_NAME
                        version findProperty("version")
                        from components.java
                        artifact(createJavaSourceJar())
                        artifact(createJavaJavadocJar())
                    }
                } else if (isAndroidModule()) {
                    release(MavenPublication) {
                        groupId ARTIFACT_GROUP
                        artifactId ARTIFACT_NAME
                        version findProperty("version")
                        artifact(getAARPath("$project.buildDir/outputs/aar"))
                        // collect source jar and add it into the component artifact.
                        Task sourceJar = createSourceJar("release-source")
                        artifact sourceJar
                        pom {
                            withXml {
                                addDependenciesToPom(asNode())
                            }
                        }
                    }
                }
                if (hasDevFlavor()) {
                    devRelease(MavenPublication) {
                        groupId ARTIFACT_GROUP
                        artifactId ARTIFACT_NAME
                        version findProperty("version")
                        artifact(getAARPath("$project.buildDir/outputs/aar", true))
                        // collect source jar and add it into the component artifact.
                        Task sourceJarDev = createSourceJar("dev-sources")
                        artifact sourceJarDev
                        pom {
                            withXml {
                                addDependenciesToPom(asNode())
                            }
                        }
                    }
                }
                withType(MavenPublication).all { publication ->
                    configurePomMetadata(publication)
                }
            }
            repositories {
                maven {
                    if (isSnapshotVersion(baseVersion)) {
                        url = uri("https://central.sonatype.com/repository/maven-snapshots/")
                        credentials {
                            username = getCentralTokenUsername()
                            password = getCentralTokenPassword()
                        }
                    } else {
                        url = getPublishRepositoryBaseDir()
                    }
                }
            }
        }
        configureSigningForPublications()
    }
    tasks.withType(PublishToMavenRepository) { task ->
        task.doFirst {
            if (isSnapshotVersion(publication.version.toString())) {
                if (!repository.credentials.username || !repository.credentials.password) {
                    throw new GradleException("Snapshot publishing requires centralTokenUsername/centralTokenPassword or CENTRAL_TOKEN_USERNAME/CENTRAL_TOKEN_PASSWORD")
                }
                repository.url = uri("https://central.sonatype.com/repository/maven-snapshots/")
            } else {
                repository.url = getPublishRepositoryVersionDir(publication.version.toString())
            }
        }
    }
}
